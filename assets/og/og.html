<!DOCTYPE html>
<!-- Source for assets/img/og-image.png (1200x630). Re-render: pwsh scripts\render-og.ps1 -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Poppins';src:url('../fonts/Poppins-Light.woff2') format('woff2');font-weight:300;}
@font-face{font-family:'Poppins';src:url('../fonts/Poppins-Medium.woff2') format('woff2');font-weight:500;}
@font-face{font-family:'Poppins';src:url('../fonts/Poppins-Bold.woff2') format('woff2');font-weight:700;}
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:1200px;height:630px;overflow:hidden;position:relative;
  background:#2F3B49;color:#F8F9FA;font-family:'Poppins',sans-serif;
  padding:84px 88px 72px;display:flex;flex-direction:column;justify-content:space-between;
}
body::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 2px);
  background-size:34px 34px;
  -webkit-mask-image:linear-gradient(112deg,transparent 40%,#000 80%);
  mask-image:linear-gradient(112deg,transparent 40%,#000 80%);
}
.bar{position:absolute;top:0;left:0;right:0;height:10px;background:#3E9DAE}
.co{font-size:34px;font-weight:700;letter-spacing:1px}
.co span{font-weight:300;color:#CDD6DF}
.tag{font-size:53px;font-weight:300;line-height:1.26;max-width:1000px}
.tag b{font-weight:700;color:#fff}
.where{font-size:21px;font-weight:500;color:#9FB0BE;letter-spacing:2.5px;text-transform:uppercase}
</style>
</head>
<body>
<div class="bar"></div>
<div class="co">SAINTS <span>Technologies &amp; Services</span></div>
<div class="tag">We put AI to work on the jobs your team still does by hand — <b>and we're still there when it needs us.</b></div>
<div class="where">saintstech.co.nz · Auckland NZ</div>
</body>
</html>
